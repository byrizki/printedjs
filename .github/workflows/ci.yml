name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  verify:
    name: Full End-to-End Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install system fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo add-apt-repository multiverse
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig \
            ttf-mscorefonts-installer \
            fonts-liberation \
            fonts-freefont-ttf \
            fonts-dejavu-core
          sudo fc-cache -f -v
          fc-match "Georgia"
          fc-match "Times New Roman"

      - name: Build packages
        run: pnpm build

      - name: Run verification (lint, format, typecheck, unit tests)
        run: pnpm verify

      - name: Check package exports and distributions
        run: pnpm pack:check

      - name: Run browser test suite (Playwright parity and visual)
        run: pnpm test:browser

      - name: Upload test results and failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            output-samples/
          if-no-files-found: ignore
          retention-days: 7
