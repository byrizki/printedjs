name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint, Format, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run verification (lint, format, typecheck, unit tests)
        run: pnpm verify

  package-integrity:
    name: Package Exports & Distribution Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check package exports and distributions
        run: pnpm pack:check

      - name: Pack packages into tarball archives
        run: pnpm pack:tarballs

      - name: Verify tarball contents and package integrity
        run: pnpm verify:tarballs

  browser-tests:
    name: Browser Tests (Playwright & Visual Parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers & dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Install system fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo add-apt-repository multiverse
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig \
            ttf-mscorefonts-installer \
            fonts-liberation \
            fonts-freefont-ttf \
            fonts-dejavu-core
          sudo fc-cache -f -v
          fc-match "Georgia"
          fc-match "Times New Roman"

      - name: Build packages
        run: pnpm build

      - name: Run browser test suite (Playwright parity and visual)
        run: pnpm test:browser

      - name: Upload test results and failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            output-samples/
          if-no-files-found: ignore
          retention-days: 7

  mobile-android:
    name: Android Dual-Architecture & Rust Core Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/headless-webview/crates -> packages/headless-webview/crates/target"
          cache-all-crates: "true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify HeadlessWebView Rust Core Android Target
        run: cargo check --manifest-path packages/headless-webview/crates/headless-webview-core/Cargo.toml --target aarch64-linux-android

      - name: Install Linux WebKit and GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            xvfb

      - name: Bundle desktop prebuilts
        run: bash scripts/bundle-cli-prebuilts.sh

      - name: Verify React Native HeadlessWebView Dual-Architecture & Packaging
        run: pnpm test:rn:example

      - name: Enable KVM hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 777 /dev/kvm || true

      - name: Run Android Emulator Maestro HTML-to-PDF Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash packages/headless-webview/example/scripts/run-android-e2e.sh

      - name: Upload Android PDF Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output-android
          path: packages/headless-webview/example/output-samples/*.pdf
          if-no-files-found: ignore

  linux-desktop:
    name: Linux Desktop Prebuilt & .NET Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/headless-webview/crates -> packages/headless-webview/crates/target"
          cache-all-crates: "true"

      - name: Install Linux WebKit and GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Bundle desktop prebuilts for CLI
        run: bash scripts/bundle-cli-prebuilts.sh

      - name: Verify Linux CLI headless binary execution
        run: ./packages/cli/bin/linux-x64/headless-webview --help

      - name: Test Linux CLI HTML to PDF rendering
        run: |
          mkdir -p output-artifacts
          echo "<html><head><title>CLI Test</title></head><body><h1>PrintedJS CLI Verification</h1><p>Generated PDF test</p></body></html>" > test-sample.html
          xvfb-run -a ./packages/cli/bin/linux-x64/headless-webview test-sample.html -o output-artifacts/linux-cli-test.pdf
          test -s output-artifacts/linux-cli-test.pdf
          head -c 4 output-artifacts/linux-cli-test.pdf | grep -q "%PDF"
          echo "✓ Verified Linux CLI HTML to PDF rendering (valid %PDF header and non-empty file)"
          rm -f test-sample.html

      - name: Upload Linux PDF Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output-linux
          path: |
            output-artifacts/*.pdf
            packages/headless-webview/example/output-samples/*.pdf
          if-no-files-found: ignore

      - name: Verify Linux .NET native runtime
        run: test -f packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/linux-x64/native/libheadless_webview_core.so

      - name: Verify HeadlessWebView .NET Suite
        run: |
          dotnet build -c Release packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/PrintedJs.HeadlessWebView.csproj
          xvfb-run -a dotnet test -c Release packages/headless-webview/dotnet/tests/PrintedJs.HeadlessWebView.Tests/PrintedJs.HeadlessWebView.Tests.csproj
          mkdir -p dist-nuget
          dotnet pack -c Release packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/PrintedJs.HeadlessWebView.csproj -o dist-nuget
          pnpm verify:nupkg

  macos-desktop:
    name: macOS Desktop Prebuilts & iOS Native App Build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/headless-webview/crates -> packages/headless-webview/crates/target"
          cache-all-crates: "true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Bundle desktop prebuilts for CLI on macOS
        run: bash scripts/bundle-cli-prebuilts.sh

      - name: Verify macOS CLI headless binary execution
        run: |
          chmod +x packages/cli/bin/darwin-arm64/headless-webview
          ./packages/cli/bin/darwin-arm64/headless-webview --help
          if [ -f packages/cli/bin/darwin-x64/headless-webview ]; then
            chmod +x packages/cli/bin/darwin-x64/headless-webview
            ./packages/cli/bin/darwin-x64/headless-webview --help
          fi

      - name: Test macOS CLI HTML to PDF rendering
        run: |
          mkdir -p output-artifacts
          echo "<html><head><title>macOS Test</title></head><body><h1>macOS CLI PDF</h1></body></html>" > test-sample.html
          ./packages/cli/bin/darwin-arm64/headless-webview test-sample.html -o output-artifacts/macos-cli-test.pdf
          test -s output-artifacts/macos-cli-test.pdf
          head -c 4 output-artifacts/macos-cli-test.pdf | grep -q "%PDF"
          echo "✓ Verified macOS CLI HTML to PDF rendering (valid %PDF header and non-empty file)"
          rm -f test-sample.html

      - name: Verify macOS .NET native runtimes
        run: |
          test -f packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/osx-arm64/native/libheadless_webview_core.dylib
          if [ -d packages/cli/bin/darwin-x64 ]; then
            test -f packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/osx-x64/native/libheadless_webview_core.dylib
          fi

      - name: Verify HeadlessWebView .NET Suite on macOS
        run: |
          dotnet build -c Release packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/PrintedJs.HeadlessWebView.csproj
          dotnet test -c Release packages/headless-webview/dotnet/tests/PrintedJs.HeadlessWebView.Tests/PrintedJs.HeadlessWebView.Tests.csproj

      - name: Build & Verify iOS Native & Example App
        run: pnpm test:rn:example

      - name: Run iOS Simulator Maestro HTML-to-PDF Test
        run: bash packages/headless-webview/example/scripts/run-ios-e2e.sh

      - name: Upload macOS & iOS PDF Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output-macos-ios
          path: |
            output-artifacts/*.pdf
            packages/headless-webview/example/output-samples/*.pdf
          if-no-files-found: ignore

  windows-desktop:
    name: Windows Desktop Prebuilt & .NET Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/headless-webview/crates -> packages/headless-webview/crates/target"
          cache-all-crates: "true"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Bundle desktop prebuilt for CLI on Windows
        shell: bash
        run: bash scripts/bundle-cli-prebuilts.sh

      - name: Verify Windows CLI headless binary execution
        shell: bash
        run: ./packages/cli/bin/win32-x64/headless-webview.exe --help

      - name: Test Windows CLI HTML to PDF rendering
        shell: bash
        run: |
          mkdir -p output-artifacts
          echo "<html><head><title>Windows Test</title></head><body><h1>Windows CLI PDF</h1></body></html>" > test-sample.html
          ./packages/cli/bin/win32-x64/headless-webview.exe test-sample.html -o output-artifacts/windows-cli-test.pdf
          test -s output-artifacts/windows-cli-test.pdf
          head -c 4 output-artifacts/windows-cli-test.pdf | grep -q "%PDF"
          echo "✓ Verified Windows CLI HTML to PDF rendering (valid %PDF header and non-empty file)"
          rm -f test-sample.html

      - name: Verify Windows .NET native runtime
        shell: bash
        run: test -f packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/win-x64/native/headless_webview_core.dll

      - name: Verify HeadlessWebView .NET Suite on Windows
        run: |
          dotnet build -c Release packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/PrintedJs.HeadlessWebView.csproj
          dotnet test -c Release packages/headless-webview/dotnet/tests/PrintedJs.HeadlessWebView.Tests/PrintedJs.HeadlessWebView.Tests.csproj

      - name: Upload Windows PDF Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output-windows
          path: |
            output-artifacts/*.pdf
            packages/headless-webview/example/output-samples/*.pdf
          if-no-files-found: ignore
