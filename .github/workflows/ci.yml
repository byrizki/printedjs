name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  verify:
    name: Full End-to-End Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install system fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo add-apt-repository multiverse
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig \
            ttf-mscorefonts-installer \
            fonts-liberation \
            fonts-freefont-ttf \
            fonts-dejavu-core
          sudo fc-cache -f -v
          fc-match "Georgia"
          fc-match "Times New Roman"

      - name: Build packages
        run: pnpm build

      - name: Bundle desktop prebuilts for CLI
        run: bash scripts/bundle-cli-prebuilts.sh

      - name: Run verification (lint, format, typecheck, unit tests)
        run: pnpm verify

      - name: Verify HeadlessWebView Rust Core
        run: cargo check --manifest-path packages/headless-webview/crates/headless-webview-core/Cargo.toml --target aarch64-linux-android

      - name: Verify HeadlessWebView .NET Suite
        run: |
          dotnet build packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/PrintedJs.HeadlessWebView.csproj
          dotnet test packages/headless-webview/dotnet/tests/PrintedJs.HeadlessWebView.Tests/PrintedJs.HeadlessWebView.Tests.csproj

      - name: Check package exports and distributions
        run: pnpm pack:check

      - name: Verify React Native HeadlessWebView Dual-Architecture & Packaging
        run: pnpm test:rn:example

      - name: Run browser test suite (Playwright parity and visual)
        run: pnpm test:browser

      - name: Upload test results and failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            output-samples/
          if-no-files-found: ignore
          retention-days: 7
