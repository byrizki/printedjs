name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  lint-and-unit:
    name: Lint, Format, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run verification (lint, format, typecheck, unit tests)
        run: pnpm verify

  package-integrity:
    name: Package Exports & Distribution Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check package exports and distribution integrity
        run: pnpm pack:check

      - name: Pack packages into tarball archives
        run: pnpm pack:tarballs

      - name: Verify tarball contents and package integrity
        run: pnpm verify:tarballs

  browser-tests:
    name: Browser Tests (Playwright & Visual Parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers & dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Install system fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo add-apt-repository multiverse
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig \
            ttf-mscorefonts-installer \
            fonts-liberation \
            fonts-freefont-ttf \
            fonts-dejavu-core
          sudo fc-cache -f -v
          fc-match "Georgia"
          fc-match "Times New Roman"

      - name: Build packages
        run: pnpm build

      - name: Run browser test suite (Playwright parity and visual)
        run: pnpm test:browser

      - name: Upload test results and failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            output-samples/
          if-no-files-found: ignore
          retention-days: 7

  mobile-android:
    name: Android Dual-Architecture & Rust Core Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/headless-webview/crates -> packages/headless-webview/crates/target"
          cache-all-crates: "true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify HeadlessWebView Rust Core Android Target
        run: cargo check --manifest-path packages/headless-webview/crates/headless-webview-core/Cargo.toml --target aarch64-linux-android

      - name: Verify React Native HeadlessWebView Dual-Architecture & Packaging
        run: pnpm test:rn:example

  build-linux:
    name: Linux Desktop Prebuilt & .NET Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/headless-webview/crates -> packages/headless-webview/crates/target"
          cache-all-crates: "true"

      - name: Install Linux WebKit and GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Bundle desktop prebuilts for CLI
        run: bash scripts/bundle-cli-prebuilts.sh

      - name: Verify Linux CLI headless binary execution
        run: ./packages/cli/bin/linux-x64/headless-webview --help

      - name: Test Linux CLI HTML to PDF rendering
        run: |
          echo "<html><head><title>CLI Test</title></head><body><h1>PrintedJS CLI Verification</h1><p>Generated PDF test</p></body></html>" > test-sample.html
          ./packages/cli/bin/linux-x64/headless-webview test-sample.html -o test-sample.pdf
          test -s test-sample.pdf
          head -c 4 test-sample.pdf | grep -q "%PDF"
          echo "✓ Verified Linux CLI HTML to PDF rendering (valid %PDF header and non-empty file)"
          rm -f test-sample.html test-sample.pdf

      - name: Verify Linux .NET native runtime
        run: test -f packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/linux-x64/native/libheadless_webview_core.so

      - name: Verify HeadlessWebView .NET Suite
        run: |
          dotnet build -c Release packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/PrintedJs.HeadlessWebView.csproj
          dotnet test -c Release packages/headless-webview/dotnet/tests/PrintedJs.HeadlessWebView.Tests/PrintedJs.HeadlessWebView.Tests.csproj

      - name: Upload Linux CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-bin-linux-x64
          path: packages/cli/bin/linux-x64/headless-webview

      - name: Upload Linux x64 .NET native library
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-runtime-linux-x64
          path: packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/linux-x64/native/libheadless_webview_core.so

  build-macos:
    name: macOS Desktop Prebuilts & iOS Native App Build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/headless-webview/crates -> packages/headless-webview/crates/target"
          cache-all-crates: "true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Bundle desktop prebuilts for CLI on macOS
        run: bash scripts/bundle-cli-prebuilts.sh

      - name: Verify macOS CLI headless binary execution
        run: |
          chmod +x packages/cli/bin/darwin-arm64/headless-webview
          ./packages/cli/bin/darwin-arm64/headless-webview --help
          if [ -f packages/cli/bin/darwin-x64/headless-webview ]; then
            chmod +x packages/cli/bin/darwin-x64/headless-webview
            ./packages/cli/bin/darwin-x64/headless-webview --help
          fi

      - name: Test macOS CLI HTML to PDF rendering
        run: |
          echo "<html><head><title>macOS Test</title></head><body><h1>macOS CLI PDF</h1></body></html>" > test-sample.html
          ./packages/cli/bin/darwin-arm64/headless-webview test-sample.html -o test-sample.pdf
          test -s test-sample.pdf
          head -c 4 test-sample.pdf | grep -q "%PDF"
          echo "✓ Verified macOS CLI HTML to PDF rendering (valid %PDF header and non-empty file)"
          rm -f test-sample.html test-sample.pdf

      - name: Verify macOS .NET native runtimes
        run: |
          test -f packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/osx-arm64/native/libheadless_webview_core.dylib
          if [ -d packages/cli/bin/darwin-x64 ]; then
            test -f packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/osx-x64/native/libheadless_webview_core.dylib
          fi

      - name: Verify HeadlessWebView .NET Suite on macOS
        run: |
          dotnet build -c Release packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/PrintedJs.HeadlessWebView.csproj
          dotnet test -c Release packages/headless-webview/dotnet/tests/PrintedJs.HeadlessWebView.Tests/PrintedJs.HeadlessWebView.Tests.csproj

      - name: Build & Verify iOS Native & Example App
        run: pnpm test:rn:example

      - name: Upload macOS ARM64 CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-bin-darwin-arm64
          path: packages/cli/bin/darwin-arm64/headless-webview

      - name: Upload macOS x64 CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-bin-darwin-x64
          path: packages/cli/bin/darwin-x64/headless-webview

      - name: Upload macOS ARM64 .NET native library
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-runtime-osx-arm64
          path: packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/osx-arm64/native/libheadless_webview_core.dylib

      - name: Upload macOS x64 .NET native library
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-runtime-osx-x64
          path: packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/osx-x64/native/libheadless_webview_core.dylib

  build-windows:
    name: Windows Desktop Prebuilt & .NET Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/headless-webview/crates -> packages/headless-webview/crates/target"
          cache-all-crates: "true"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Bundle desktop prebuilt for CLI on Windows
        shell: bash
        run: bash scripts/bundle-cli-prebuilts.sh

      - name: Verify Windows CLI headless binary execution
        shell: bash
        run: ./packages/cli/bin/win32-x64/headless-webview.exe --help

      - name: Test Windows CLI HTML to PDF rendering
        shell: bash
        run: |
          echo "<html><head><title>Windows Test</title></head><body><h1>Windows CLI PDF</h1></body></html>" > test-sample.html
          ./packages/cli/bin/win32-x64/headless-webview.exe test-sample.html -o test-sample.pdf
          test -s test-sample.pdf
          head -c 4 test-sample.pdf | grep -q "%PDF"
          echo "✓ Verified Windows CLI HTML to PDF rendering (valid %PDF header and non-empty file)"
          rm -f test-sample.html test-sample.pdf

      - name: Verify Windows .NET native runtime
        shell: bash
        run: test -f packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/win-x64/native/headless_webview_core.dll

      - name: Verify HeadlessWebView .NET Suite on Windows
        run: |
          dotnet build -c Release packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/PrintedJs.HeadlessWebView.csproj
          dotnet test -c Release packages/headless-webview/dotnet/tests/PrintedJs.HeadlessWebView.Tests/PrintedJs.HeadlessWebView.Tests.csproj

      - name: Upload Windows CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-bin-win32-x64
          path: packages/cli/bin/win32-x64/headless-webview.exe

      - name: Upload Windows x64 .NET native library
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-runtime-win-x64
          path: packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/win-x64/native/headless_webview_core.dll

  release:
    name: Publish to npm, NuGet & GitHub Release
    needs:
      [
        lint-and-unit,
        package-integrity,
        browser-tests,
        mobile-android,
        build-linux,
        build-macos,
        build-windows,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Download Linux CLI prebuilt
        uses: actions/download-artifact@v4
        with:
          name: cli-bin-linux-x64
          path: packages/cli/bin/linux-x64

      - name: Download macOS ARM64 CLI prebuilt
        uses: actions/download-artifact@v4
        with:
          name: cli-bin-darwin-arm64
          path: packages/cli/bin/darwin-arm64

      - name: Download macOS x64 CLI prebuilt
        uses: actions/download-artifact@v4
        with:
          name: cli-bin-darwin-x64
          path: packages/cli/bin/darwin-x64

      - name: Download Windows CLI prebuilt
        uses: actions/download-artifact@v4
        with:
          name: cli-bin-win32-x64
          path: packages/cli/bin/win32-x64

      - name: Download Linux x64 .NET runtime
        uses: actions/download-artifact@v4
        with:
          name: dotnet-runtime-linux-x64
          path: packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/linux-x64/native

      - name: Download macOS ARM64 .NET runtime
        uses: actions/download-artifact@v4
        with:
          name: dotnet-runtime-osx-arm64
          path: packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/osx-arm64/native

      - name: Download macOS x64 .NET runtime
        uses: actions/download-artifact@v4
        with:
          name: dotnet-runtime-osx-x64
          path: packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/osx-x64/native

      - name: Download Windows x64 .NET runtime
        uses: actions/download-artifact@v4
        with:
          name: dotnet-runtime-win-x64
          path: packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes/win-x64/native

      - name: Ensure executable permissions on bundled binaries
        run: |
          cp packages/cli/bin/linux-x64/headless-webview packages/cli/bin/headless-webview
          chmod +x packages/cli/bin/headless-webview || true
          chmod +x packages/cli/bin/linux-x64/headless-webview || true
          chmod +x packages/cli/bin/darwin-*/headless-webview || true
          ls -lR packages/cli/bin
          ls -lR packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/runtimes

      - name: Check package exports and distribution integrity
        run: pnpm pack:check

      - name: Pack packages into tarball archives
        run: pnpm pack:tarballs

      - name: Verify tarball contents and package integrity
        run: pnpm verify:tarballs
        env:
          VERIFY_ALL_CLI_PREBUILTS: "true"

      - name: Pack .NET NuGet package
        run: |
          dotnet build -c Release packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/PrintedJs.HeadlessWebView.csproj
          mkdir -p dist-nuget
          dotnet pack -c Release packages/headless-webview/dotnet/PrintedJs.HeadlessWebView/PrintedJs.HeadlessWebView.csproj -o dist-nuget

      - name: Verify NuGet package contents and prebuilt native runtimes
        run: pnpm verify:nupkg
        env:
          VERIFY_ALL_NATIVE_PREBUILTS: "true"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          pnpm exec tsx scripts/extract-release-notes.ts "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with assets
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file dist/release-notes.md \
            ./dist-tarballs/*.tgz \
            ./dist-nuget/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tarball packages to npm
        run: |
          for tarball in ./dist-tarballs/*.tgz; do
            echo "Publishing $tarball to npm..."
            pnpm publish "$tarball" --access public --no-git-checks
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish NuGet package to NuGet.org
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push dist-nuget/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
