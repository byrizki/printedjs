[package]
name = "headless-webview-core"
version = "0.2.0"
edition = "2024"
authors = ["PrintedJS Contributors"]
description = "Core headless webview runtime powered by Wry and UniFFI"
license = "MIT"

[lib]
name = "headless_webview_core"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[[bin]]
name = "headless-webview"
path = "src/bin/headless_webview.rs"
required-features = ["os-webview"]

[features]
default = []
os-webview = ["wry/os-webview"]

[dependencies]
wry = { path = "../vendor/wry-headless", default-features = false }
uniffi = { version = "0.32.2", features = ["cli", "tokio"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
uniffi = { version = "0.32.2", features = ["build"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", default-features = false }
wry = { path = "../vendor/wry-headless", features = ["x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSRunLoop", "NSDate", "NSString"] }
